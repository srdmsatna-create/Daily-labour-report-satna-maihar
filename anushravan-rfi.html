<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anushravan Dashboard RFI | SRDM SATNA</title>
<style>body{font:13px Arial,sans-serif;margin:0;background:#faf7ff;color:#24134f}header{background:#fff;padding:12px 18px;border-bottom:3px solid #54279a}h1{margin:0;color:#54279a;font-size:21px}.muted{color:#5b4a77}.wrap{padding:10px 16px}.toolbar{display:flex;gap:8px;justify-content:flex-end}.toolbar button,button{background:#6b39c2;color:#fff;border:0;border-radius:5px;padding:7px 12px;font-weight:bold}select{padding:8px;border:1px solid #9a78c8;border-radius:5px;background:#fff}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}.card{background:#fff;border:1px solid #7852aa;border-radius:8px;padding:9px}.card b{display:block;font-size:22px;color:#1b0d63;margin-top:4px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:7px;align-items:end}.filters label{font-size:11px;font-weight:bold;color:#4d3278}table{border-collapse:collapse;width:100%;background:#fff;margin-top:8px}th,td{border:1px solid #4c2b84;padding:6px 8px}th{background:#54279a;color:#fff;text-align:center}td.num{text-align:center;font-weight:bold}.total{background:#d6c4eb;font-weight:bold}.grand{background:#2f145e;color:#fff;font-weight:bold}.pending{margin-top:12px;background:#fff5f5;border:1px solid #df7777;border-radius:7px;padding:10px;color:#a00}.pending li{margin:3px 0}.error{color:#b42318}</style>
<header><div class="toolbar"><a href="index.html">← मुख्य पोर्टल</a><button id="refresh">↻ Refresh</button><button id="csv">↓ Excel Download</button></div><h1>Anushravan Dashboard — RFI</h1><div class="muted">District-wise • Janpad-wise • Cluster-wise • GP-wise RFI monitoring</div></header><div class="wrap"><div class="cards"><div class="card">कुल RFI Raised<b id="raised">0</b></div><div class="card">Pending<b id="pending">0</b></div><div class="card">Approved<b id="approved">0</b></div><div class="card">Rejected<b id="rejected">0</b></div><div class="card">कुल GP<b id="gpcount">0</b></div></div><div class="filters"><label>District<select id="district"><option value="0">All District</option><option value="429">Satna</option><option value="784">Maihar</option></select></label><label>Janpad<select id="block"><option value="0">सभी जनपद</option></select></label><label>Cluster<select id="cluster"><option value="">सभी Cluster</option></select></label><label>Status<select id="statusFilter"><option value="">सभी GP</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></label><button id="reset">Reset</button></div><div id="status" class="muted">डेटा लोड हो रहा है…</div><h3>जनपदवार सारांश</h3><table><thead><tr><th>जिला</th><th>जनपद</th><th>कुल GP</th><th>RFI Raised</th><th>Pending</th><th>Approved</th><th>Rejected</th><th>Cluster / GP विवरण</th></tr></thead><tbody id="rows"></tbody></table><div class="pending"><b>लंबित RFI — GP विवरण</b><ul id="pendingList"></ul></div></div><script>
const API='https://sipri.mp.gov.in/sipri_api/api/JalRekhaAnushrawan',TOKEN='8KQ1I4HZ-7e66ded3-29c3-41e2-be86-b2476d6f7b6a';let blocks=[],rows=[],master=[];
const $=id=>document.getElementById(id),post=(ep,p)=>fetch(API+'/'+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,...p})}).then(r=>r.json());
async function loadMaster(){try{const t=await fetch('gp-sector-engineer-master-25-09-2026.csv').then(r=>r.text());const [h,...ls]=t.trim().split(/\r?\n/);const ix=h.split(',');master=ls.map(x=>{const a=x.split(',');return {gp:(a[ix.indexOf('Gram_Panchayat')]||a[ix.indexOf('GP_20Sep_Name')]||'').toUpperCase(),block:(a[ix.indexOf('Janpad')]||a[ix.indexOf('Janpad_Name')]||'').toUpperCase(),cluster:(a[ix.indexOf('Sector')]||a[ix.indexOf('Cluster')]||'')};});}catch(e){}}
function formatSyncTime(value){return new Date(value).toLocaleString('en-IN',{hour12:true,hour:'numeric',minute:'2-digit',second:'2-digit',day:'2-digit',month:'short',year:'numeric'}).replace(/\s+/g,' ')}
async function load(){ $('status').textContent='डेटा लोड हो रहा है…';const d=$('district').value,b=$('block').value;try{if(!master.length)await loadMaster();let out=[];const districts=d==='0'?['429','784']:[d];for(const x of districts){const summary=await post('Get_DistrictSummary_JRAnushr',{dist_cd:x,b_cd:'0'});const list=summary.data||[];if(b!=='0'&&d!=='0'){const z=await post('Get_BlockSummary_JRAnushr',{dist_cd:d,b_cd:b,lgd_gp_cd:'0'});out.push(...(z.data||[]));}else{for(const blk of list){const z=await post('Get_BlockSummary_JRAnushr',{dist_cd:x,b_cd:blk.block_cd,lgd_gp_cd:'0'});out.push(...(z.data||[]));}}}rows=out.map(r=>{const m=master.find(x=>x.gp===String(r.gp_nm||'').toUpperCase()&&(!x.block||x.block===String(r.block_nm||'').toUpperCase()));return {...r,cluster:m?.cluster||'—'};});fillBlocks();render();$('status').textContent='अंतिम सिंक: '+formatSyncTime(Date.now());}catch(e){$('status').innerHTML='<span class="error">डेटा सेवा उपलब्ध नहीं: '+e.message+'</span>';}}
function fillBlocks(){const s=$('block'),v=s.value;s.innerHTML='<option value="0">सभी जनपद</option>'+[...new Map(rows.filter(r=>r.block_cd).map(r=>[r.block_cd,r.block_nm])).entries()].map(([k,n])=>`<option value="${k}">${n}</option>`).join('');if([...s.options].some(o=>o.value===v))s.value=v;const c=$('cluster');c.innerHTML='<option value="">सभी क्लस्टर</option>'+[...new Set(rows.map(r=>r.cluster).filter(x=>x&&x!=='—'))].sort().map(x=>`<option>${x}</option>`).join('');}
function render(){const f=rows.filter(r=>(!$('cluster').value||r.cluster===$('cluster').value));let t=[0,0,0,0];f.forEach(r=>{t[0]+=+r.rfi_raised||0;t[1]+=+r.pending_se||0;t[2]+=+r.approved||0;t[3]+=+r.rejected||0});['raised','pending','approved','rejected'].forEach((x,i)=>$(x).textContent=t[i].toLocaleString('en-IN'));$('rows').innerHTML=f.map((r,i)=>`<tr><td class="num">${i+1}</td><td>${r.dist_nm||'—'}</td><td>${r.block_nm||'—'}</td><td>${r.cluster||'—'}</td><td>${r.gp_nm||'—'}</td><td class="num">${r.rfi_raised||0}</td><td class="num">${r.pending_se||0}</td><td class="num">${r.approved||0}</td><td class="num">${r.rejected||0}</td></tr>`).join('')||'<tr><td colspan="9">कोई रिकॉर्ड नहीं</td></tr>';}
function download(){const f=rows.filter(r=>!$('cluster').value||r.cluster===$('cluster').value);const h='जिला,जनपद,Cluster,GP,RFI Raised,Pending,Approved,Rejected\n';const b=f.map(r=>[r.dist_nm,r.block_nm,r.cluster,r.gp_nm,r.rfi_raised||0,r.pending_se||0,r.approved||0,r.rejected||0].join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h+b],{type:'text/csv'}));a.download='Anushravan_RFI.csv';a.click();}$('district').onchange=()=>{ $('block').value='0';load()};$('block').onchange=load;$('cluster').onchange=render;$('refresh').onclick=load;$('csv').onclick=download;load();
</script>
