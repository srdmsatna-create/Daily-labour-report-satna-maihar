<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner Portal • SRDM SATNA</title><style>:root{--n:#0b3159;--b:#146fd1;--g:#11865b;--bg:#f4f7fb;--line:#d5e1ef;--muted:#66778c}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans Devanagari",Arial,sans-serif;background:var(--bg);color:#18304a}header{background:linear-gradient(125deg,#082646,#146fd1);color:#fff;padding:20px max(18px,calc((100vw - 1450px)/2));box-shadow:0 7px 26px #12365b30}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:28px}.sub{margin-top:5px;opacity:.85}.back{color:#fff;text-decoration:none;border:1px solid #ffffff66;padding:9px 13px;border-radius:10px;font-weight:800}main{max-width:1450px;margin:16px auto;padding:0 14px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:10px}.kpi,.box,.tools{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px #1a35520b}.kpi{padding:14px}.kpi small{color:var(--muted);font-weight:800}.kpi strong{display:block;font-size:29px;color:var(--n);margin-top:3px}.kpi:nth-child(3) strong{color:var(--g)}.tools{padding:10px;margin:10px 0;display:flex;gap:8px;flex-wrap:wrap}.tools select,.tools input,.tools button{padding:9px 11px;border:1px solid #c9d8e8;border-radius:9px;background:#fff;font-weight:700}.tools button{background:var(--n);color:#fff}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:12px}.box{padding:12px}.box h2{margin:0 0 8px;color:var(--n);font-size:19px}.wrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{border:1px solid #a8bdd3;padding:8px 9px;font-size:13px;text-align:right}th{position:sticky;top:0;background:#cfe2f7;color:#0c3158;z-index:2}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}tbody tr:nth-child(even){background:#f8fbff}.total{font-weight:900;background:#dbe9fb}.meta{margin:8px 0 0;color:var(--muted);font-size:12px}.warn{padding:11px 12px;border-left:5px solid #d99000;background:#fff8e6;border-radius:10px;margin-bottom:10px}.good{color:var(--g);font-weight:900}@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:560px){.kpis{grid-template-columns:1fr}}@media print{header .back,.tools{display:none}.wrap{max-height:none;overflow:visible}th{position:static}.grid{display:block}.box{margin-bottom:12px}}</style></head><body><header><div class="head"><div><h1>Planner Portal</h1><div class="sub">जनपदवार • पंचायतवार • नवीन कार्य संख्या • FY 2026-27</div></div><a class="back" href="./">← SRDM Applications</a></div></header><main><div id="msg" class="warn" style="display:none"></div><div class="kpis"><div class="kpi"><small>कुल जनपद</small><strong id="kJanpad">0</strong></div><div class="kpi"><small>कुल पंचायत</small><strong id="kGp">0</strong></div><div class="kpi"><small>कुल नवीन कार्य</small><strong id="kNew">0</strong></div><div class="kpi"><small>कुल कार्य योजना</small><strong id="kTotal">0</strong></div></div><div class="tools"><select id="janpad"><option value="ALL">— सभी जनपद —</option></select><input id="q" placeholder="पंचायत खोजें"><button onclick="window.print()">प्रिंट</button></div><div class="grid"><section class="box"><h2>जनपदवार नवीन कार्य</h2><div class="wrap"><table><thead><tr><th>क्र.</th><th>जनपद</th><th>नवीन कार्य</th><th>स्पिल ओवर</th><th>कुल कार्य</th></tr></thead><tbody id="blockBody"></tbody></table></div></section><section class="box"><h2>पंचायतवार नवीन कार्य</h2><div class="wrap"><table><thead><tr><th>क्र.</th><th>जनपद</th><th>ग्राम पंचायत</th><th>नवीन कार्य</th><th>स्पिल ओवर</th><th>कुल कार्य</th></tr></thead><tbody id="gpBody"></tbody></table></div></section></div><div class="meta" id="meta"></div></main><script src="planner-portal-data.js?v=1"></script><script>(function(){const d=window.PLANNER_PORTAL_DATA||{blocks:[],panchayats:[],totals:{}};const $=id=>document.getElementById(id),n=v=>new Intl.NumberFormat('en-IN').format(Number(v)||0),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('kJanpad').textContent=n(d.totals.janpads);$('kGp').textContent=n(d.totals.panchayats);$('kNew').textContent=n(d.totals.newWorks);$('kTotal').textContent=n(d.totals.totalWorks);d.blocks.forEach(x=>$('janpad').add(new Option(x.janpad,x.janpad)));function renderBlocks(){const rows=d.blocks;$('blockBody').innerHTML=rows.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.janpad)}</b></td><td class="good">${n(x.newWorks)}</td><td>${n(x.spillWorks)}</td><td>${n(x.totalWorks)}</td></tr>`).join('')+`<tr class="total"><td></td><td>कुल</td><td>${n(rows.reduce((a,x)=>a+x.newWorks,0))}</td><td>${n(rows.reduce((a,x)=>a+x.spillWorks,0))}</td><td>${n(rows.reduce((a,x)=>a+x.totalWorks,0))}</td></tr>`}function renderGp(){const j=$('janpad').value,q=$('q').value.trim().toLowerCase();const rows=d.panchayats.filter(x=>(j==='ALL'||x.janpad===j)&&(!q||String(x.panchayat).toLowerCase().includes(q)));$('gpBody').innerHTML=rows.length?rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.janpad)}</td><td><b>${esc(x.panchayat)}</b></td><td class="good">${n(x.newWorks)}</td><td>${n(x.spillWorks)}</td><td>${n(x.totalWorks)}</td></tr>`).join(''):`<tr><td colspan="6" style="text-align:center">पंचायतवार data refresh हो रहा है / उपलब्ध नहीं है</td></tr>`}renderBlocks();renderGp();$('janpad').onchange=renderGp;$('q').oninput=renderGp;if(!d.blocks.length){$('msg').style.display='block';$('msg').textContent='Planner official data अभी उपलब्ध नहीं है।';}else if(!d.panchayats.length){$('msg').style.display='block';$('msg').textContent='जनपदवार data उपलब्ध है; पंचायतवार data का official refresh जारी है।';}$('meta').textContent='Source: Official Planner • Updated: '+(d.updatedAt||'—');})();</script></body></html>
