</style></head><body><main class="wrap"><header class="top"><h1>R4.2 • E-Muster Roll एवं Wagelist रिपोर्ट</h1><p>FY 2026–27 • सतना जिला • 8 जनपद</p></header><div class="tools"><button onclick="window.print()">प्रिंट / PDF</button><button id="csv">Excel / CSV डाउनलोड</button></div><div class="meta" id="meta">आधिकारिक स्रोत का डेटा लोड हो रहा है…</div><div class="tablewrap"><table><thead><tr><th rowspan="2">क्र.</th><th rowspan="2">जनपद</th><th colspan="5">Unskilled Muster Roll</th><th colspan="4">Skilled / Semi-skilled Muster Roll</th><th colspan="2">Wagelist</th></tr><tr><th>जारी</th><th>भरे</th><th>Deleted</th><th>शून्य उपस्थिति</th><th>कुल भरे</th><th>जारी</th><th>भरे</th><th>शून्य उपस्थिति</th><th>कुल भरे</th><th>Generated</th><th>MR covered</th></tr></thead><tbody id="body"><tr><td colspan="13">लोड हो रहा है…</td></tr></tbody></table></div><div class="source" id="source"></div></main><script>
const fmt=n=>Number(n||0).toLocaleString('en-IN');async function load(){const r=await fetch('data/r42-emuster-wagelist.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('R4.2 डेटा उपलब्ध नहीं');const d=await r.json();const keys=['uIssued','uFilled','uDeleted','uZero','uTotal','sIssued','sFilled','sZero','sTotal','wagelists','covered'];document.getElementById('body').innerHTML=d.rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x.block+'</td>'+keys.map(k=>'<td>'+fmt(x[k])+'</td>').join('')+'</tr>').join('')+'<tr class="total"><td colspan="2">जनपद योग / कुल योग</td>'+keys.map(k=>'<td>'+fmt(d.totals[k])+'</td>').join('')+'</tr>';document.getElementById('meta').textContent='जाँच दिनांक: '+d.checkedDate+(d.officialDate?' • स्रोत रिपोर्ट दिनांक: '+d.officialDate:' • स्रोत पेज पर रिपोर्ट दिनांक उपलब्ध नहीं')+(d.fetchedAt?' • Fetch: '+new Date(d.fetchedAt).toLocaleString('hi-IN',{timeZone:'Asia/Kolkata'}):'');document.getElementById('source').innerHTML='<a href="'+d.source+'" target="_blank" rel="noopener noreferrer">आधिकारिक R4.2 स्रोत खोलें ↗</a>'}load().catch(e=>document.getElementById('body').innerHTML='<tr><td colspan="13">'+e.message+'</td></tr>');
document.getElementById('csv').onclick=async()=>{const d=await (await fetch('data/r42-emuster-wagelist.json?t='+Date.now(),{cache:'no-store'})).json(),heads=['Janpad','Unskilled Issued','Unskilled Filled','Deleted','Zero attendance','Unskilled total filled','Skilled issued','Skilled filled','Skilled zero attendance','Skilled total filled','Wagelists','MR covered'],ks=['uIssued','uFilled','uDeleted','uZero','uTotal','sIssued','sFilled','sZero','sTotal','wagelists','covered'],rows=[heads,...d.rows.map(r=>[r.block,...ks.map(k=>r[k])]),['TOTAL',...ks.map(k=>d.totals[k])]],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='R4.2-emuster-wagelist.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
