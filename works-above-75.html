ommunity":"नाडेप","Levelling/shaping of Wasteland Land for Community":"बंजर भूमि समतलीकरण","Levelling/shaping of Fallow land for Individuals":"भूमि समतलीकरण","Block Plantation - Shelter Belt for Individuals":"शेल्टर बेल्ट वृक्षारोपण","Development of chaur Land for Community":"चौर भूमि विकास","Construction of Mini Percolation Tank for Comm":"मिनी परकोलेशन टैंक","Constr of agri produce storage building for groups":"कृषि उपज भंडारण","Constr of Boulder Anicut Check Dam for Community":"बोल्डर चेक डैम","Construction of Cyclone shelter for Community":"चक्रवात आश्रय","Renovation of Fisheries Ponds for Community":"मत्स्य तालाब जीर्णोद्धार","Repair & Maint of Gabion Check Dam for Community":"गेबियन चेक डैम मरम्मत","Constr of SHG/Fed building for Groups":"SHG भवन","Constr of Berkeley Compost Pit for Individual":"कम्पोस्ट पिट","Repair & Maint of Anganwadi Building":"आंगनवाड़ी मरम्मत","Constr of Water Absorption Trench Trench for Comm":"जल अवशोषण ट्रेंच","Constr of Masonry/CC Anicut for Community":"CC एनीकट","Block Plantation in fields-Horticulture-Community":"बागवानी वृक्षारोपण","Constr of Kitchen Shed":"किचन शेड","Prduction of building material (Comm)":"निर्माण सामग्री उत्पादन","Constr of Wire crate (gabion) Spur for Comm":"गेबियन स्पर","Repair & maint of Gravel Road Roads for Comm":"ग्रेवल रोड मरम्मत","Construction of Village/Rural Haat for community":"ग्रामीण हाट","Construction of Community Sanitary Complex":"सामुदायिक स्वच्छता परिसर","Constr of Piggery Shelter for Community":"सूकर शेड","Constr of Bharat Nirman Seva Kendra":"भारत निर्माण सेवा केंद्र"};function shortType(v,name=''){if(/sha(?:n|m)ti[\s_-]*dha(?:m|am)|शा[ंँ]ति\s*धाम/i.test(String(name).normalize('NFKC')))return 'शांतिधाम';if(/\bIAY\b/i.test(String(v)))return 'PMAY-G';if(/m[eai]+[dḍ](?:h)?[\s_-]*bandh?(?:an)?|मे[ड़ढडध]़?\s*(?:बंध|बन्ध)|मेड\s*बंध/i.test(String(name).normalize('NFKC')))return 'मेढ़ बंधान';return typeNames[v]||String(v||'प्रकार उपलब्ध नहीं').replace(/^(Construction|Constr|Const) of /i,'').replace(/ for (Individuals?|Community|Comm|Groups?)$/i,'').trim()}let reportView='work';let controls={},shown=[];let source=[];let snapshot={};let data=source.map(r=>({...r,cost:Number(r.nregaBooked||0)+Number(r.vbgBooked||0),san:Number(r.sanction)})).filter(r=>r.san>0&&Number.isFinite(r.cost)&&r.cost/r.san*100>=75);for(let [k,label] of [['district','जिला'],['janpad','जनपद'],['engineer','उपयंत्री'],['cluster','क्लस्टर'],['panchayat','GP'],['fy','वर्ष'],['type','कार्य का प्रकार']]){let s=document.createElement('select');s.innerHTML='<option value="">सभी '+label+'</option>'+[...new Set(data.map(r=>r[k]))].filter(Boolean).sort().map(v=>'<option>'+esc(v)+'</option>').join('');s.onchange=()=>refreshFilters(k);controls[k]=s;document.getElementById('filters').append(s)}let search=document.createElement('input');search.placeholder='कार्य नाम / कोड';search.oninput=render;document.getElementById('filters').append(search);let b=document.createElement('button');b.textContent='प्रिंट / PDF';b.onclick=()=>print();document.getElementById('filters').append(b);function refreshFilters(changed){const order=['district','janpad','engineer','cluster','panchayat'];let idx=order.indexOf(changed);if(idx>=0)for(let k of order.slice(idx+1))controls[k].value='';let scoped=data;for(let k of order){let c=controls[k],old=c.value,first=c.options[0].outerHTML,vals=[...new Set(scoped.map(r=>r[k]))].filter(Boolean).sort();c.innerHTML=first+vals.map(v=>'<option>'+esc(v)+'</option>').join('');c.value=vals.includes(old)?old:'';if(c.value)scoped=scoped.filter(r=>r[k]===c.value)}for(let k of ['fy','type']){let c=controls[k],old=c.value,vals=[...new Set(scoped.map(r=>r[k]))].filter(Boolean).sort();c.innerHTML=c.options[0].outerHTML+vals.map(v=>'<option>'+esc(v)+'</option>').join('');c.value=vals.includes(old)?old:''}render()}
function render(){shown=data.filter(r=>Object.entries(controls).every(([k,c])=>!c.value||r[k]===c.value)&&(!search.value||(r.name+' '+r.code).toLowerCase().includes(search.value.toLowerCase()))).sort((a,b)=>b.cost/b.san-a.cost/a.san);document.getElementById('summary').textContent='कार्य: '+shown.length+' • स्रोत तिथि: '+(snapshot.fetchedAt||'उपलब्ध नहीं')+' • VBGRAMG मिलान लंबित: '+(snapshot.unmatched?.length||0);const districtTotals=['सतना','मैहर'].map(d=>{let rr=shown.filter(r=>r.district===d),san=rr.reduce((a,r)=>a+r.san,0),cost=rr.reduce((a,r)=>a+r.cost,0);return '<tr><th>'+d+' जिला योग</th><td class="num">'+n(rr.length)+'</td><td class="num">'+n(san)+'</td><td class="num">'+n(cost)+'</td><td class="num">'+n(san-cost)+'</td></tr>'}).join('');document.getElementById('districtSummary').innerHTML='<table><thead><tr><th>जिला</th><th>कुल कार्य</th><th>स्वीकृत राशि ₹</th><th>कुल व्यय ₹</th><th>शेष राशि ₹</th></tr></thead><tbody>'+districtTotals+'</tbody></table>';renderSummary();document.getElementById('rows').innerHTML=shown.map((r,i)=>'<tr><td class="num">'+n(i+1)+'</td>'+[r.district,r.janpad,r.engineer,r.cluster,r.panchayat,r.fy,r.type,r.code,String(r.name||'').replace(/\bIAY\b/gi,'PMAY-G')].map((v,i)=>'<td'+(i===8?' class="work-name"':'')+' title="'+esc(v)+'"><span'+(i===8?' class="two-line"':'')+'>'+esc(v)+'</span></td>').join('')+'<td class="num">'+n(r.san)+'</td><td class="num">'+n(r.cost)+'</td><td class="num">'+n(r.cost/r.san*100)+'%</td><td class="num">'+n(r.san-r.cost)+'</td></tr>').join('')||'<tr><td colspan="14">कोई मिलान नहीं / स्रोत डेटा उपलब्ध नहीं</td></tr>';let s=shown.reduce((a,r)=>a+r.san,0),c=shown.reduce((a,r)=>a+r.cost,0);document.getElementById('total').innerHTML='<tr><th colspan="10">योग</th><th>'+n(s)+'</th><th>'+n(c)+'</th><th>'+n(s?c/s*100:0)+'%</th><th>'+n(s-c)+'</th></tr>'}function renderSummary(){let dims=reportView==='district'?['district']:reportView==='janpad'?['district','janpad']:['district','janpad','engineer'];let gs=new Map();for(let r of shown){let key=JSON.stringify(dims.map(k=>r[k]));if(!gs.has(key))gs.set(key,{labels:dims.map(k=>r[k]),works:0,san:0,cost:0});let g=gs.get(key);g.works++;g.san+=r.san;g.cost+=r.cost}let labels=dims.map(k=>({district:'जिला',janpad:'जनपद',engineer:'उपयंत्री'})[k]);let html='<table class="summary-table"><thead><tr><th>क्रमांक</th>'+labels.map(h=>'<th>'+h+'</th>').join('')+'<th>कुल कार्य</th><th>स्वीकृत राशि ₹</th><th>कुल व्यय ₹</th><th>व्यय %</th><th>शेष राशि ₹</th></tr></thead><tbody>'+[...gs.values()].sort((a,b)=>b.cost/b.san-a.cost/a.san).map((g,i)=>'<tr><td class="num">'+n(i+1)+'</td>'+g.labels.map(v=>'<td>'+esc(v)+'</td>').join('')+'<td class="num">'+n(g.works)+'</td><td class="num">'+n(g.san)+'</td><td class="num">'+n(g.cost)+'</td><td class="num">'+n(g.san?g.cost/g.san*100:0)+'%</td><td class="num">'+n(g.san-g.cost)+'</td></tr>').join('')+'</tbody></table>';document.getElementById('summaryReport').innerHTML=html;document.getElementById('summaryReport').style.display=reportView==='work'?'none':'block';document.getElementById('workReport').style.display=reportView==='work'?'block':'none';document.querySelectorAll('[data-summary-view]').forEach(b=>b.classList.toggle('active',b.dataset.summaryView===reportView))}
