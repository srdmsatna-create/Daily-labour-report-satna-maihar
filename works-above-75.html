<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>75% से अधिक व्यय वाले कार्य</title><style>body{font:16px system-ui;background:#edf3f8;color:#15344e;margin:24px}h1{color:#123f70}nav{display:flex;gap:10px;flex-wrap:wrap}select,input,button{font:inherit;padding:9px}table{border-collapse:collapse;width:100%;background:white;margin-top:20px}td,th{border:1px solid #405870;padding:8px}th{background:#dce7f3}td.num{text-align:right;font-weight:bold}.scroll{overflow:auto}@media print{nav,a{display:none}thead{display:table-header-group}body{margin:0}@page{size:A4 landscape}}</style><a href="index.html">← मुख्य पोर्टल</a><h1>75% से अधिक व्यय वाले कार्य</h1><p>कुल व्यय ÷ स्वीकृत राशि × 100 &gt; 75। ठीक 75% वाले कार्य शामिल नहीं हैं।</p><p id="summary"></p><nav id="filters"></nav><div class="scroll"><table><thead><tr><th>जनपद</th><th>उपयंत्री</th><th>क्लस्टर</th><th>GP</th><th>वर्ष</th><th>स्थिति</th><th>कार्य कोड</th><th>कार्य नाम</th><th>स्वीकृति ₹</th><th>MGNREGA व्यय ₹</th><th>VBGRAMG व्यय ₹</th><th>कुल व्यय ₹</th><th>व्यय %</th></tr></thead><tbody id="rows"></tbody><tfoot id="total"></tfoot></table></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=x=>Number(x).toLocaleString('en-IN',{maximumFractionDigits:2});let controls={},shown=[];let source=[];let snapshot={};let data=source.map(r=>({...r,cost:Number(r.overallBooked??r.booked),san:Number(r.sanction)})).filter(r=>r.san>0&&Number.isFinite(r.cost)&&r.cost/r.san*100>75);for(let [k,label] of [['janpad','जनपद'],['engineer','उपयंत्री'],['cluster','क्लस्टर'],['panchayat','GP'],['fy','वर्ष'],['status','स्थिति']]){let s=document.createElement('select');s.innerHTML='<option value="">सभी '+label+'</option>'+[...new Set(data.map(r=>r[k]))].filter(Boolean).sort().map(v=>'<option>'+esc(v)+'</option>').join('');s.onchange=render;controls[k]=s;document.getElementById('filters').append(s)}let search=document.createElement('input');search.placeholder='कार्य नाम / कोड';search.oninput=render;document.getElementById('filters').append(search);let b=document.createElement('button');b.textContent='प्रिंट / PDF';b.onclick=()=>print();document.getElementById('filters').append(b);function render(){shown=data.filter(r=>Object.entries(controls).every(([k,c])=>!c.value||r[k]===c.value)&&(!search.value||(r.name+' '+r.code).toLowerCase().includes(search.value.toLowerCase()))).sort((a,b)=>b.cost/b.san-a.cost/a.san);document.getElementById('summary').textContent='कार्य: '+shown.length+' • स्रोत तिथि: '+(snapshot.fetchedAt||'उपलब्ध नहीं')+' • VBGRAMG मिलान लंबित: '+(snapshot.unmatched?.length||0);document.getElementById('rows').innerHTML=shown.map(r=>'<tr>'+[r.janpad,r.engineer,r.cluster,r.panchayat,r.fy,r.status,r.code,r.name].map(v=>'<td>'+esc(v)+'</td>').join('')+'<td class="num">'+n(r.san)+'</td><td class="num">'+n(r.nregaBooked)+'</td><td class="num">'+n(r.vbgBooked)+'</td><td class="num">'+n(r.cost)+'</td><td class="num">'+n(r.cost/r.san*100)+'%</td></tr>').join('')||'<tr><td colspan="11">कोई मिलान नहीं / स्रोत डेटा उपलब्ध नहीं</td></tr>';let s=shown.reduce((a,r)=>a+r.san,0),c=shown.reduce((a,r)=>a+r.cost,0);document.getElementById('total').innerHTML='<tr><th colspan="8">योग</th><th>'+n(s)+'</th><th>'+n(shown.reduce((a,r)=>a+r.nregaBooked,0))+'</th><th>'+n(shown.reduce((a,r)=>a+r.vbgBooked,0))+'</th><th>'+n(c)+'</th><th>'+n(s?c/s*100:0)+'%</th></tr>'}fetch('data/above75-latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{snapshot=d;source=d.rows;data=source.map(r=>({...r,cost:Number(r.overallBooked),san:Number(r.sanction)})).filter(r=>r.san>0&&r.cost/r.san*100>75);for(let [k,c] of Object.entries(controls)){c.innerHTML=c.options[0].outerHTML+[...new Set(data.map(r=>r[k]))].filter(Boolean).sort().map(v=>'<option>'+esc(v)+'</option>').join('')}render()}).catch(()=>document.getElementById('summary').textContent='संयुक्त स्रोत डेटा उपलब्ध नहीं; सफल fetch आवश्यक है।');</script><link rel="stylesheet" href="srdm-report-fonts.css?v=20261012-large"></html>
