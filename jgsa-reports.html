<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JGSA विस्तृत रिपोर्ट</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#153250;font:14px Arial,sans-serif}header{padding:18px;background:#195889;color:white}main{padding:16px}h1{font-size:23px}h2{font-size:18px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,select,input{padding:9px;border:1px solid #91acc6;border-radius:5px;background:white;color:#183e65;font:inherit}button{cursor:pointer;font-weight:bold}.active{background:#195889;color:white}.wrap{overflow:auto;background:white;margin:12px 0}table{border-collapse:collapse;min-width:1550px;width:100%;font-size:13px}th,td{border:1px solid #86a6c5;padding:8px}th{background:#dbeaf9;text-align:center;position:sticky;top:0}td.n{text-align:right;white-space:nowrap;font-weight:700}tr:nth-child(even){background:#f3f8fc}.maihar td{background:#e1f1e7}.satna td{background:#e4edfb}.grand td{background:#cedef0;font-weight:900}.note{background:white;border:1px solid #abc1d8;padding:12px;line-height:1.7}summary{cursor:pointer;font-weight:bold}@media print{@page{size:A4 landscape;margin:7mm}body{background:white}.controls,header a{display:none}header{background:white;color:black;padding:0}main{padding:0}h1{font-size:14pt}h2{font-size:11pt}.wrap{overflow:visible}table{min-width:0;width:100%;table-layout:fixed;font-size:6.5pt}th,td{padding:1mm .6mm;overflow-wrap:anywhere}td.n{white-space:normal}th{position:static}thead{display:table-header-group}tr{break-inside:avoid}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style><body><header><a href="index.html">← SRDM Applications</a><h1 id="title"></h1><div>JGSA कार्य एवं वित्तीय स्नैपशॉट: 07-06-2026 • राशियाँ ₹ लाख में</div></header><main><div class="controls" id="nav"><button data-mode="summary">R-4.2 स्थिति एवं वित्तीय सारांश</button><button data-mode="ranking">R-4.3 उपयंत्री / क्लस्टर रैंकिंग</button><button data-mode="works">R-4.5 श्रेणी एवं कार्यवार विवरण</button></div><div class="note">व्यय = Booked मजदूरी + Booked सामग्री। शेष = स्वीकृत − Booked व्यय। उपयंत्री नाम 07-06-2026 स्नैपशॉट अनुसार; क्लस्टर 25-09-2026 मास्टर से मिलान, न मिलने पर “मैपिंग लंबित”।</div><div class="controls"><select id="district"><option value="">दोनों जिले</option></select><select id="block"><option value="">सभी जनपद</option></select><select id="engineer"><option value="">सभी उपयंत्री</option></select><select id="cluster"><option value="">सभी क्लस्टर</option></select><select id="category"><option value="">सभी श्रेणियाँ</option></select><select id="status"><option value="">तीनों स्थिति</option><option>Ongoing</option><option>Completed</option><option>Physically Completed</option></select><input id="search" placeholder="कार्य नाम / कोड / पंचायत"></div><div class="controls"><button id="print">Print / Save as PDF</button><button id="csv">Excel CSV</button><button id="reset">फिल्टर हटाएँ</button></div><div id="report"></div></main><script src="jgsa-report-data-0.js"></script><script src="jgsa-report-data-1.js"></script><script src="jgsa-report-data-2.js"></script><script src="jgsa-report-data-3.js"></script><script src="jgsa-report-data-4.js"></script><script src="jgsa-report-data-5.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),money=n=>fmt(n/100000),names={district:'जिला',block:'जनपद',engineer:'उपयंत्री',cluster:'क्लस्टर',category:'श्रेणी'};
const rows=(window.JGSA_REPORT_DATA?.rows||[]).map(a=>({district:['AMARPATAN','RAMNAGAR','MAIHAR'].includes(a[1])?'MAIHAR':'SATNA',block:a[1],engineer:a[2],cluster:a[3],gp:a[4],code:a[5],name:a[6],category:a[7],status:a[8],ws:Number(a[9]||0),ms:Number(a[10]||0),wb:Number(a[11]||0),mb:Number(a[12]||0)}));let mode=new URLSearchParams(location.search).get('report')||'summary',exports=[],workPage=0,printAll=false;
const sum=(r,k)=>r.reduce((s,w)=>s+w[k],0);
function metrics(r){let ws=sum(r,'ws'),ms=sum(r,'ms'),wb=sum(r,'wb'),mb=sum(r,'mb');return {count:r.length,o:r.filter(w=>w.status==='Ongoing').length,c:r.filter(w=>w.status==='Completed').length,p:r.filter(w=>w.status==='Physically Completed').length,cost:ws+ms,wb,mb,exp:wb+mb,pct:ws+ms?(wb+mb)/(ws+ms)*100:null,bw:ws-wb,bm:ms-mb,balance:ws+ms-wb-mb};}
const heads=['कुल कार्य','Ongoing','Completed','Physically Completed','कुल स्वीकृत लागत','व्यय मजदूरी','व्यय सामग्री','कुल व्यय','व्यय %','शेष मजदूरी','शेष सामग्री','कुल शेष'];
function cells(r){let a=metrics(r);return [a.count,a.o,a.c,a.p,money(a.cost),money(a.wb),money(a.mb),money(a.exp),a.pct===null?'—':fmt(a.pct)+'%',money(a.bw),money(a.bm),money(a.balance)];}
function groups(r,keys){let m=new Map;for(const w of r){let vals=keys.map(k=>w[k]||'मैपिंग लंबित'),key=JSON.stringify(vals);if(!m.has(key))m.set(key,{vals,rows:[]});m.get(key).rows.push(w);}return [...m.values()].sort((a,b)=>a.vals.join().localeCompare(b.vals.join(),'hi'));}
function breakdown(r){let total=metrics(r).cost;return groups(r,['category']).map(g=>{let a=metrics(g.rows),on=metrics(g.rows.filter(w=>w.status==='Ongoing'));return {category:g.vals[0],weight:total?a.cost/total:null,a:(a.c+a.p)/a.count*5,b:on.count?(on.cost?Math.min(5,on.exp/on.cost*5):null):5,cost:a.cost};});}
function score(r){let b=breakdown(r);if(!metrics(r).cost||b.some(c=>c.b===null))return null;return b.reduce((s,c)=>s+c.weight*(c.a+c.b),0);}
function table(h,b){exports.push({h,b});return '<div class="wrap"><table><thead><tr>'+h.map(x=>'<th>'+escape(x)+'</th>').join('')+'</tr></thead><tbody>'+b.map(r=>'<tr class="'+(r[0]==='MAIHAR योग'?'maihar':r[0]==='SATNA योग'?'satna':r[0]==='संयुक्त योग'?'grand':'')+'">'+r.map((v,i)=>'<td'+(i>=h.length-12?' class="n"':'')+'>'+escape(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function totals(r,n){return ['MAIHAR','SATNA','संयुक्त'].map(d=>[d+' योग',...Array(n-1).fill(''),...cells(d==='संयुक्त'?r:r.filter(w=>w.district===d))]);}
function filtered(){let q=$('search').value.toLowerCase();return rows.filter(w=>['district','block','engineer','cluster','category','status'].every(k=>!$(k).value||w[k]===$(k).value)&&(!q||[w.code,w.name,w.gp].join(' ').toLowerCase().includes(q)));}
function fill(id,r){let el=$(id),old=el.value,first=el.options[0].outerHTML;el.innerHTML=first+[...new Set(r.map(w=>w[id]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'hi')).map(x=>'<option>'+escape(x)+'</option>').join('');if([...el.options].some(o=>o.value===old))el.value=old;}
function cascade(){workPage=0;let r=rows;for(const id of ['district','block','engineer','cluster','category']){fill(id,r);if($(id).value)r=r.filter(w=>w[id]===$(id).value);}render();}
function ranks(r,keys,label){let g=groups(r,keys).map(g=>({...g,score:score(g.rows)})).sort((a,b)=>(b.score??-1)-(a.score??-1)||a.vals.join().localeCompare(b.vals.join(),'hi'));let last=-1,rank=0;return '<h2>'+label+'</h2>'+table(['रैंक',...keys.map(k=>names[k]),'स्कोर /10','ग्रेड',...heads],g.map((g,i)=>{let s=g.score===null?null:Math.round(g.score*100)/100;if(s!==last){rank=i+1;last=s;}return [s===null?'—':rank,...g.vals,s===null?'—':fmt(s),s===null?'—':s>=8?'A':s>=6?'B':s>=4?'C':'D',...cells(g.rows)];}));}
function render(){exports=[];if(!['summary','ranking','works'].includes(mode))mode='summary';let r=filtered();$('title').textContent=({summary:'R-4.2 — JGSA स्थिति एवं वित्तीय सारांश',ranking:'R-4.3 — JGSA उपयंत्री / क्लस्टर रैंकिंग',works:'R-4.5 — JGSA श्रेणी एवं कार्यवार विवरण'})[mode];document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));let h='<p>चयनित कार्य: '+r.length.toLocaleString('en-IN')+' • चयनित फिल्टर अनुसार रिपोर्ट</p><h2>जिलावार एवं संयुक्त योग</h2>'+table(['जिला',...heads],totals(r,1));
if(mode==='summary')for(const keys of [['district','block'],['district','block','engineer','cluster']])h+='<h2>'+keys.map(k=>names[k]).join(' / ')+' सारांश</h2>'+table([...keys.map(k=>names[k]),...heads],groups(r,keys).map(g=>[...g.vals,...cells(g.rows)]).concat(totals(r,keys.length)));
if(mode==='ranking'){h+='<div class="note"><b>सभी स्तरों के समान JGSA पैरामीटर</b><br>Part A = (Completed + Physically Completed) ÷ कुल कार्य × 5।<br>Part B = प्रगतिरत Booked व्यय ÷ प्रगतिरत स्वीकृत लागत × 5 (अधिकतम 5; प्रगतिरत कार्य नहीं तो 5)।<br>श्रेणी भार = श्रेणी स्वीकृति ÷ कुल स्वीकृति। स्कोर /10 = Σ भार × (Part A + Part B)।<br>ये स्नैपशॉट से गणना की गई रैंक हैं। शून्य स्वीकृति वाले अपूर्ण समूह को रैंक नहीं दी गई है। फिल्टर बदलने पर चुने गए समूह में रैंक पुनः बनेगी।</div>';for(const [k,l] of [[['district'],'जिला रैंक'],[['district','block'],'जनपद रैंक'],[['district','block','engineer'],'उपयंत्री रैंक'],[['district','block','engineer','cluster'],'उपयंत्री / क्लस्टर रैंक']])h+=ranks(r,k,l);h+='<details><summary>उपयंत्री श्रेणीवार स्कोर का विवरण</summary>'+table(['जिला','जनपद','उपयंत्री','श्रेणी','स्वीकृति ₹ लाख','भार %','Part A /5','Part B /5'],groups(r,['district','block','engineer']).flatMap(g=>breakdown(g.rows).map(c=>[...g.vals,c.category,money(c.cost),c.weight===null?'—':fmt(c.weight*100),fmt(c.a),c.b===null?'—':fmt(c.b)])))+'</details>';}
if(mode==='works'){let keys=['district','block','engineer','cluster','category'];h+='<h2>उपयंत्री / क्लस्टर × श्रेणीवार विवरण</h2>'+table([...keys.map(k=>names[k]),...heads],groups(r,keys).map(g=>[...g.vals,...cells(g.rows)]).concat(totals(r,5)));let pages=Math.max(1,Math.ceil(r.length/100));workPage=Math.min(workPage,pages-1);let visible=printAll?r:r.slice(workPage*100,(workPage+1)*100);h+='<h2>कार्यवार विवरण ('+r.length+' कार्य)</h2><div class="controls"><button onclick="workPage=Math.max(0,workPage-1);render()">← पिछला</button><span>पेज '+(workPage+1)+' / '+pages+' • प्रति पेज 100 कार्य • प्रिंट में सभी कार्य</span><button onclick="workPage=Math.min('+(pages-1)+',workPage+1);render()">अगला →</button></div>'+table(['क्र.','जिला','जनपद','उपयंत्री','क्लस्टर','पंचायत','श्रेणी','कार्य कोड','कार्य नाम','स्थिति',...heads.slice(4)],visible.map((w,i)=>[i+1+(printAll?0:workPage*100),w.district,w.block,w.engineer,w.cluster,w.gp,w.category,w.code,w.name,w.status,...cells([w]).slice(4)]));}
$('report').innerHTML=h;}
for(const id of ['district','block','engineer','cluster','category'])$(id).onchange=cascade;$('status').onchange=render;$('search').oninput=render;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;history.replaceState(null,'','?report='+mode);render();});$('print').onclick=()=>{printAll=true;render();setTimeout(()=>{window.print();},200);};window.addEventListener('afterprint',()=>{printAll=false;render();});$('reset').onclick=()=>{for(const id of ['district','block','engineer','cluster','category','status','search'])$(id).value='';cascade();};$('csv').onclick=()=>{printAll=true;render();let lines=[];exports.forEach(t=>lines.push(t.h,...t.b,[]));let csv='\uFEFF'+lines.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='JGSA-'+mode+'-07-06-2026.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);printAll=false;render();};cascade();
</script></body></html>
