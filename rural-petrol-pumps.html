function choices(select, label, values) {
 const previous = select.value;
 const sorted = [...new Set(values)].filter(Boolean).sort((a,b) => a.localeCompare(b,"hi"));
 select.replaceChildren(new Option(label,""), ...sorted.map(value => new Option(value,value)));
 select.value = sorted.includes(previous) ? previous : "";
}

function fillRow(body, values, numericIndex = -1, janpad) {
 const tr = body.insertRow();
 if (janpadColors.has(janpad)) tr.dataset.janpad = janpadColors.get(janpad);
 values.forEach((value, i) => {
   const td = tr.insertCell();

   if (i === numericIndex) td.className = "num";
 });
 return tr;
}
const taxNumber = new Intl.NumberFormat("en-IN");
function taxRange(count) {
 return taxNumber.format(20000 * count) + "–" + taxNumber.format(30000 * count);
}
function render() {
 const districtRows = rows.filter(row => !district.value || row[2] === district.value);
 choices(block, "सभी जनपद", districtRows.map(row => row[3]));
 const blockRows = districtRows.filter(row => !block.value || row[3] === block.value);
 choices(panchayat, "सभी ग्राम पंचायतें", blockRows.map(row => row[4]));
 const filtered = blockRows.filter(row => !panchayat.value || row[4] === panchayat.value);
 const details = get("details");
 const janpadCounts = new Map();
 for (const row of filtered) {
   const key = JSON.stringify(row.slice(2,4));
   janpadCounts.set(key, (janpadCounts.get(key) || 0) + 1);
 }
 const gpCounts = new Map();
 details.replaceChildren();
 for (let index = 0; index < filtered.length; index++) {
   const row = filtered[index];
   const gpKey = JSON.stringify(row.slice(2,5));
   gpCounts.set(gpKey, (gpCounts.get(gpKey) || 0) + 1);
   const tr = fillRow(details, [String(row[0]), ...row.slice(1,9), taxRange(1)], 9, row[3]);
   if (row[9].startsWith("https://www.google.com/maps/")) {
     const link = document.createElement("a");
     link.href = row[9];
     link.target = "_blank";
     link.rel = "noopener";
     link.textContent = row[5];
     tr.cells[5].replaceChildren(link);
   }
   const nextRow = filtered[index + 1];
   if (!nextRow || nextRow[3] !== row[3]) {
     const janpadCount = filtered.slice(0, index + 1).filter(item => item[3] === row[3]).length;
     const totalRow = fillRow(details, ["", "", "", row[2], "", "", row[3] + " — जनपद कुल", "", "", taxRange(janpadCount)], 9, row[3]);
     totalRow.className = "district-total";
     if (!nextRow || nextRow[2] !== row[2]) {
       const districtCount = filtered.slice(0, index + 1).filter(item => item[2] === row[2]).length;
       const districtRow = fillRow(details, ["", "", row[2] + " — जिला कुल", "", "", "", "", "", "", taxRange(districtCount)], 9, row[3]);
       districtRow.className = "district-grand-total";
     }
   }
 }
 if (filtered.length) {
   const combinedRow = fillRow(details, ["", "", "सतना + मैहर — संयुक्त कुल", "", "", "", "", "", "", taxRange(filtered.length)], 9, "maihar");
   combinedRow.className = "district-grand-total combined-total";
 }
 get("result").textContent = filtered.length ? filtered.length + " / " + rows.length + " प्रविष्टियाँ" : "इन फ़िल्टरों पर कोई प्रविष्टि नहीं मिली।";
}
choices(district,"सभी जिले",rows.map(row => row[2]));
[district,block,panchayat].forEach(select => select.addEventListener("change",render));
get("reset").addEventListener("click",() => { district.value = block.value = panchayat.value = ""; render(); });
render();
</script></body></html>
