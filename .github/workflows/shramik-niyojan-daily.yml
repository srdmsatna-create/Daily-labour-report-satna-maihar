name: Shramik Niyojan Daily Update

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/shramik-refresh-trigger.txt'
  schedule:
    - cron: "35 2 * * *"   # 08:05 AM IST

permissions:
  contents: write

concurrency:
  group: shramik-niyojan-daily
  cancel-in-progress: false

jobs:
  update-shramik:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Update Shramik Niyojan
        run: python scripts_local/update_shramik_niyojan.py
      - name: Commit verified Shramik data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shramik-niyojan-data.js
          if git diff --cached --quiet; then
            echo "No Shramik Niyojan data change."
            exit 0
          fi
          git commit -m "Daily Shramik Niyojan update $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
