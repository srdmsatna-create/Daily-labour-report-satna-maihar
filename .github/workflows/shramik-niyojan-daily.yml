name: Shramik Niyojan Daily Update

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/shramik-refresh-trigger.txt'
  schedule:
    - cron: "35 2 * * *"   # 08:05 AM IST

permissions:
  contents: write

concurrency:
  group: shramik-niyojan-daily
  cancel-in-progress: false

jobs:
  update-shramik:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Update Shramik Niyojan
        env:
          VBGRAM_COOKIE: ${{ secrets.VBGRAM_COOKIE }}
          SHRAMIK_FY2627_URL: "https://vbgramgrep.dord.gov.in/VBGRAMG/demand_emp_demand.aspx?payload=f3pAdpSH0D2ksLrgBJlJyGT5-ciQnM96jHdrk-6lyw0BNtpA7SA155AAYH8sTl7Uwx6YdMOP62dzTTUk4js8_Vlwxk5xp7XLEXw5-r0L9OX3qx-zF68AZHWHyI3_IKL7U_XZFWII2TzhZR6dNVPepu8d5hV2cHFmQxYmjt1XwVUleZQboQTxmhKe9915hIPA5SgVl4rYYRPoNmuzM2UQj-Vc0zJKuj-XTWpFynG2qwUmj523SWATo7xOH1o0G-d07y8qi5RzpshAU-m7SOsT5H62NDRSeP6GRFgWgwMhnPGOfUpFhyeMRrKFNOvbZdF3FiyPDbqt3Co4S9x9gtZmA13kziHkYHJpkvoF9Yvc8DTbFgTdWy7iWlSkHn_IIcxcvwby_6d6fSt8J2QEPryoczpN75E84iy6Mxw7wcOvesi3vXUK5ZHkDkTxDfBDtGuA"
          SHRAMIK_FY2526_URL: ${{ secrets.SHRAMIK_FY2526_URL }}
        run: python scripts_local/update_shramik_niyojan.py
      - name: Commit verified Shramik data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shramik-niyojan-data.js
          if git diff --cached --quiet; then
            echo "No Shramik Niyojan data change."
            exit 0
          fi
          git commit -m "Daily Shramik Niyojan update $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
