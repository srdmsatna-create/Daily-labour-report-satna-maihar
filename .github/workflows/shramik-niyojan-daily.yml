name: Shramik Niyojan Daily Update

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/shramik-refresh-trigger.txt'
  schedule:
    - cron: "35 2 * * *"   # 08:05 AM IST

permissions:
  contents: write

concurrency:
  group: shramik-niyojan-daily
  cancel-in-progress: false

jobs:
  update-shramik:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Update Shramik Niyojan
        env:
          VBGRAM_COOKIE: ${{ secrets.VBGRAM_COOKIE }}
          SHRAMIK_FY2627_URL: "https://vbgramgrep.dord.gov.in/VBGRAMG/demand_emp_demand.aspx?payload=v0-5YXVmpU91NQ9Jbk4c0c5c9vRvZ0r6SNmryYSJjN379CS6P3rf46ZugVPOMLfOSOtnPS4jHMPjYSGzPOUu_rrtNZd7GtPwI-7imr9qbJKj1vs5XzLF8-2MBcF0fvEDMeSm8VExajL98t0CH_yMkTagwXLFzsyY5RYAB_HK8yuwLzcrtf05JLMHVjOUdd8eO4PefiChLfNu_Eo6cVLa-DxMtysOSNnWhAhz3sarM1iBpU6rnf5PFuKW65UZJmfnoxHsW3GhgzA-43D-hJsaUZPDvjV_kyInV0RncuCGPTRYnmV74xZ1z9zd4azT8o3jJZD6d1XuwzSjSo22WSe6fMzfJ9w_G5Ft_l1ugBtUMrLsKN6giHsZ1CROpuLOunwbKTTOwXKKnRhslqhMST9_5Dj74hSNSPbAN1PGf3EuFTi0hUDYYIuLSsvN9VWu1UEA"
          SHRAMIK_FY2526_URL: ${{ secrets.SHRAMIK_FY2526_URL }}
        run: python scripts_local/update_shramik_niyojan.py
      - name: Commit verified Shramik data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shramik-niyojan-data.js
          if git diff --cached --quiet; then
            echo "No Shramik Niyojan data change."
            exit 0
          fi
          git commit -m "Daily Shramik Niyojan update $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
