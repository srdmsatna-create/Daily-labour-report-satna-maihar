name: AS Before Geotag Report Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *" # 10:00 IST
  push:
    paths:
      - "scripts_local/update_as_geotag_before.py"
      - "as-geotag-before.html"
      - ".github/workflows/as-geotag-before.yml"

permissions:
  contents: write

concurrency:
  group: as-geotag-before-update
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Fetch official AS and before-stage geotag status
        run: python scripts_local/update_as_geotag_before.py

      - name: Validate generated report data
        run: |
          test -s data/as-geotag-before-latest.json
          test -s as-geotag-before-data.js
          test -s as-geotag-before.html
          test -s index.html

      - name: Commit report data and menu card
        run: |
          git config user.name "VBGRAMG Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/as-geotag-before-latest.json as-geotag-before-data.js
          if git diff --cached --quiet; then
            echo "No report data or menu change."
            exit 0
          fi
          git commit -m "Update AS before-stage geotag report"
          git pull --rebase
          git push
