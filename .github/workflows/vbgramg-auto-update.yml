name: VBGRAMG Cloud Auto Update

on:
  schedule:
    # 07:00 AM IST = 01:30 UTC
    - cron: "30 1 * * *"
    # 08:00 AM IST = 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vbgramg-auto-update
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Fetch official VB-G RAM G data
        run: |
          python scripts_local/local_auto_update.py

      - name: Merge dashboard data
        run: |
          python scripts/merge_official_summary.py

      - name: Validate generated files
        shell: bash
        run: |
          test -f data/official-summary.csv
          test -f data/fetch-status.json
          test -f auto-data.js
          test -f auto-status.js

      - name: Commit and push only when data changed
        shell: bash
        run: |
          git config user.name "VBGRAMG Auto Update"
          git config user.email "actions@users.noreply.github.com"

          git add data/official-summary.csv data/fetch-status.json auto-data.js auto-status.js

          if git diff --cached --quiet; then
            echo "No dashboard data change."
            exit 0
          fi

          git commit -m "Automatic VBGRAMG dashboard update"
          git pull --rebase
          git push
