name: R8.1.5 Rejected Wage Daily Refresh
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rejected-wage-daily.yml'
      - 'scripts/update_rejected_wage.py'
permissions:
  contents: write
concurrency:
  group: rejected-wage-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Fetch and validate official R8.1.5 data
        env:
          REJECTED_WAGE_SOURCE_URL: ${{ secrets.REJECTED_WAGE_SOURCE_URL }}
        run: python scripts/update_rejected_wage.py
      - name: Publish verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rejected-wage-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update rejected wage report $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
