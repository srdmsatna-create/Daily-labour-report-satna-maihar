name: Probe official R6.12 export
on:
  push:
    paths: ['.github/workflows/probe-r612-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Request supplied official report
        env:
          REPORT_URL: 'https://vbgramgrep.dord.gov.in/VBGRAMG/dynamic_work_details.aspx?payload=6u351zl5tudeybeGK_BeQXsBt9kMa3O3R6evE-_kq0svpl3GeiRc-0gg_WIhenhlp97kOY5lBGrOdqUX5JNGYGm1y_qGpbEEdVjX9SQbcVU6v49htio9M1YKwt2HsPJ6ix1wv3nCXHCngtlav89pePKq4DShtsDy3YEbpomkLdBuolc8DphYvKDPBYUPBEm8'
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.error,re
          u=os.environ['REPORT_URL']
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/vnd.ms-excel,*/*'})
          try:
              with urllib.request.urlopen(req,timeout=45) as response:
                  data=response.read(25000000)
                  print('HTTP:',response.status,'TYPE:',response.headers.get('Content-Type'),'BYTES:',len(data),'FINAL:',response.url)
                  print('PREFIX:',repr(data[:500]))
                  if len(data)>100000 and (data[:2]==b'PK' or b'Work Code' in data[:50000] or b'Work Status' in data[:50000]):
                      open('r612-response.bin','wb').write(data)
                      print('REPORT CANDIDATE SAVED')
                  else:
                      print('No verified work-level export; refusing to publish')
          except Exception as e:
              print('DOWNLOAD FAILED:',type(e).__name__,str(e))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r612-report-candidate
          path: r612-response.bin
          if-no-files-found: ignore
          retention-days: 1
