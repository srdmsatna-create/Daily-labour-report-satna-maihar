name: AS Geotag SECURE TS Counts

on:
  workflow_dispatch:
  push:
    paths:
      - "as-geotag-before.html"
      - "scripts_local/fetch_secure_ts_counts.py"
      - "scripts_local/apply_secure_ts_counts.py"
      - ".github/workflows/as-geotag-secure-ts.yml"

permissions:
  contents: write

concurrency:
  group: as-geotag-secure-ts
  cancel-in-progress: false

jobs:
  update-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch full-FY SECURE /YD/ TS data by script
        run: python scripts_local/fetch_secure_ts_counts.py
      - name: Merge SECURE counts into AS/Before report
        run: python scripts_local/apply_secure_ts_counts.py
      - name: Validate generated files
        run: |
          test -s data/secure-ts-yuktadhara-fy2026-27.json
          test -s secure-ts-data.js
          test -s as-geotag-before-data.js
      - name: Commit and push updated data
        run: |
          git config user.name "VBGRAMG Auto Update"
          git config user.email "actions@users.noreply.github.com"
          git add data/secure-ts-yuktadhara-fy2026-27.json secure-ts-data.js as-geotag-before-data.js
          if git diff --cached --quiet; then
            echo "No SECURE TS or report data change."
            exit 0
          fi
          git commit -m "Update full-FY SECURE YD TS counts"
          git pull --rebase
          git push
