name: VB-G RAM G Daily Auto Report

on:
  workflow_dispatch:
  schedule:
    # IST: 07:30 and 14:30 daily (GitHub cron uses UTC)
    - cron: '0 2 * * *'
    - cron: '0 9 * * *'

permissions:
  contents: write

concurrency:
  group: vbgram-daily-report-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # IMPORTANT:
      # Workflow run may start from an older commit. Always move the runner
      # to the latest remote main BEFORE generating report files.
      - name: Sync latest main before update
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch official VB-G RAM G sources
        id: fetch
        continue-on-error: true
        env:
          VBGRAM_DAILY_REPORT_URL: ${{ secrets.VBGRAM_DAILY_REPORT_URL }}
          VBGRAM_DAILY_REPORT_XLSX_URL: ${{ secrets.VBGRAM_DAILY_REPORT_XLSX_URL }}
          VBGRAM_ONGOING_CSV_URL: ${{ secrets.VBGRAM_ONGOING_CSV_URL }}
          VBGRAM_USERNAME: ${{ secrets.VBGRAM_USERNAME }}
          VBGRAM_PASSWORD: ${{ secrets.VBGRAM_PASSWORD }}
          VBGRAM_COOKIE: ${{ secrets.VBGRAM_COOKIE }}
        run: python scripts/fetch_official_vbgram.py

      - name: Apply fresh official data
        if: steps.fetch.outcome == 'success'
        env:
          DAILY_REPORT_XLSX_URL: ''
        run: python scripts/apply_auto_update.py

      - name: Validate KPIs before publishing
        if: steps.fetch.outcome == 'success'
        run: python scripts/validate_auto_data.py

      - name: Keep previous valid report if source fetch fails
        if: steps.fetch.outcome != 'success'
        run: echo "Official source/export was not usable; previous valid auto-data.js remains live."

      - name: Commit changed report data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"

          git add auto-data.js auto-status.js ongoing-details.js data/fetch-status.json data/official-summary.csv data/Ongoing_Works_dynamic_work_details_latest.csv incoming/Daily\ Report.xlsx 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Auto update daily report data"

          # The remote can change while this workflow is running.
          # Rebase on the latest main and retry the push instead of failing
          # with: rejected main -> main (fetch first).
          for attempt in 1 2 3 4; do
            echo "Push attempt ${attempt}/4"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected. Keeping generated report files from this run."
              git checkout --theirs -- auto-data.js auto-status.js ongoing-details.js data/fetch-status.json data/official-summary.csv data/Ongoing_Works_dynamic_work_details_latest.csv "incoming/Daily Report.xlsx" 2>/dev/null || true
              git add auto-data.js auto-status.js ongoing-details.js data/fetch-status.json data/official-summary.csv data/Ongoing_Works_dynamic_work_details_latest.csv "incoming/Daily Report.xlsx" 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || {
                git rebase --abort || true
                echo "Could not resolve rebase automatically."
                exit 1
              }
            fi

            if git push origin HEAD:main; then
              echo "Report data pushed successfully."
              exit 0
            fi

            echo "Remote changed again; retrying in 5 seconds..."
            sleep 5
          done

          echo "Push failed after 4 attempts."
          exit 1
