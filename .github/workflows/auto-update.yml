name: Daily Report Auto Update
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2,5,8,11,14 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build auto data
        env:
          DAILY_REPORT_XLSX_URL: ${{ secrets.DAILY_REPORT_XLSX_URL }}
        run: python scripts/update_daily_report.py
      - name: Commit changed report data
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add auto-data.js
          git diff --cached --quiet && exit 0
          git commit -m "Auto update daily report data"
          git push
