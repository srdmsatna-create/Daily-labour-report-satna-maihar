name: Restore SRDM portal card thumbnails

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'scripts/patch_portal_card_thumbnails.py'
      - 'scripts/fix_srdm_launcher_cards.py'
      - 'scripts/patch_planner_sipri_screen2_icon.py'
      - '.github/workflows/patch-portal-card-thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite SRDM launcher portal cards
        run: python scripts/fix_srdm_launcher_cards.py

      - name: Apply user screen 2 icon to Planner-to-SIPRI dashboard
        run: python scripts/patch_planner_sipri_screen2_icon.py

      - name: Commit only when changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No launcher card changes needed."
            exit 0
          fi
          git config user.name "srdmsatna-create"
          git config user.email "srdmsatna@gmail.com"
          git add index.html
          git commit -m "Use screen 2 image on Planner to SIPRI dashboard card"
          git push
