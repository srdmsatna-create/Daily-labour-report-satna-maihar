name: Complete SRDM daily reports at 8 AM India
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
  push:
    paths:
      - '.github/workflows/all-tabs-daily.yml'
      - 'scripts_local/run_daily_unified.py'
      - 'scripts_local/vbgram_access.py'
permissions:
  contents: write
concurrency:
  group: srdm-all-tabs-daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ${{ fromJSON(vars.SRDM_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report readers
        run: |
          pip install -r requirements.txt requests beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Verify shared session and rollback behavior
        run: |
          python scripts_local/test_vbgram_access.py
          python scripts_local/test_unified_daily.py
      - name: Refresh, reconcile and publish complete reports together
        env:
          VBGRAM_COOKIE: ${{ secrets.VBGRAM_COOKIE }}
          VBGRAM_DAILY_REPORT_URL: ${{ secrets.VBGRAM_DAILY_REPORT_URL }}
          SHRAMIK_FY2627_URL: ${{ secrets.SHRAMIK_FY2627_URL }}
          SHRAMIK_FY2526_URL: ${{ secrets.SHRAMIK_FY2526_URL }}
          REJECTED_WAGE_SOURCE_URL: ${{ secrets.REJECTED_WAGE_SOURCE_URL }}
        run: python -u scripts_local/run_daily_unified.py --publish --publish-verified
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-failure
          path: |
            daily-update-last-failure.json
            daily-update-diagnostics.zip
          if-no-files-found: ignore
