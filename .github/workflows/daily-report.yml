name: VB-G RAM G Daily Auto Report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"   # 08:00 AM IST

permissions:
  contents: write

concurrency:
  group: vbgram-daily-auto-report
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch official VB-G RAM G data
        env:
          VBGRAM_DAILY_REPORT_URL: ${{ secrets.VBGRAM_DAILY_REPORT_URL }}
          VBGRAM_DAILY_REPORT_XLSX_URL: ${{ secrets.VBGRAM_DAILY_REPORT_XLSX_URL }}
          VBGRAM_ONGOING_CSV_URL: ${{ secrets.VBGRAM_ONGOING_CSV_URL }}
          VBGRAM_COOKIE: ${{ secrets.VBGRAM_COOKIE }}
          VBGRAM_USERNAME: ${{ secrets.VBGRAM_USERNAME }}
          VBGRAM_PASSWORD: ${{ secrets.VBGRAM_PASSWORD }}
        run: |
          python scripts/fetch_official_vbgram.py

      - name: Apply official update
        run: |
          python scripts/apply_auto_update.py

      - name: Validate published data
        run: |
          python scripts/validate_auto_data.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add auto-data.js auto-status.js data/ official-summary.csv fetch-status.json ongoing-details.js index.html || true

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Daily auto report update $(date -u +'%Y-%m-%d')"

          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              sleep 5
              continue
            }

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 5
          done

          echo "Push failed after retries."
          exit 1
