name: VB-G RAM G Daily Auto Report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/refresh-trigger.txt'
  schedule:
    - cron: "30 2 * * *"   # 08:00 AM IST

permissions:
  contents: write

concurrency:
  group: vbgram-daily-auto-report
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Primary official fetch
        id: primary
        continue-on-error: true
        env:
          VBGRAM_DAILY_REPORT_URL: ${{ secrets.VBGRAM_DAILY_REPORT_URL }}
          VBGRAM_DAILY_REPORT_XLSX_URL: ${{ secrets.VBGRAM_DAILY_REPORT_XLSX_URL }}
          VBGRAM_ONGOING_CSV_URL: ${{ secrets.VBGRAM_ONGOING_CSV_URL }}
          VBGRAM_COOKIE: ${{ secrets.VBGRAM_COOKIE }}
          VBGRAM_USERNAME: ${{ secrets.VBGRAM_USERNAME }}
          VBGRAM_PASSWORD: ${{ secrets.VBGRAM_PASSWORD }}
        run: |
          python scripts/fetch_official_vbgram.py

      - name: Apply primary official update
        if: steps.primary.outcome == 'success'
        run: |
          python scripts/apply_auto_update.py

      - name: Fallback R6.9 cloud fetch
        id: fallback
        if: steps.primary.outcome != 'success'
        continue-on-error: true
        run: |
          python scripts_local/local_auto_update_cloud_v2.py

      - name: Merge fallback dashboard data
        if: steps.primary.outcome != 'success' && steps.fallback.outcome == 'success'
        run: |
          python scripts/merge_official_summary.py

      - name: Stop if both fetch methods failed
        if: steps.primary.outcome != 'success' && steps.fallback.outcome != 'success'
        run: |
          echo "Both official fetch methods failed. Existing verified dashboard data is preserved."
          exit 1

      - name: Validate published data
        run: |
          python scripts/validate_auto_data.py

      - name: Refresh R8.1.5 rejected wage report
        id: rejected_wage
        continue-on-error: true
        env:
          REJECTED_WAGE_SOURCE_URL: ${{ secrets.REJECTED_WAGE_SOURCE_URL }}
        run: python scripts/update_rejected_wage.py

      - name: Report rejected wage fetch failure
        if: steps.rejected_wage.outcome == 'failure'
        run: echo "R8.1.5 source unavailable or layout changed; previous verified snapshot preserved."

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/rejected-wage-latest.json auto-data.js auto-status.js data/ official-summary.csv fetch-status.json ongoing-details.js index.html app.js || true

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Daily auto report update $(date -u +'%Y-%m-%d')"

          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              sleep 5
              continue
            }

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 5
          done

          echo "Push failed after retries."
          exit 1
