<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>पूर्ण कार्यों का जियो टैग — Phase II: After</title><style>
*{box-sizing:border-box}body{font-family:Arial,"Noto Sans Devanagari",sans-serif;margin:0;padding:20px;background:#eff4f8;color:#193b57}main{max-width:1280px;margin:auto;background:white;padding:20px;border:1px solid #c8d6e2;border-radius:7px}h1{font-size:24px;color:#087548;text-align:center;margin:12px 0}p.meta{text-align:center;font-size:13px}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,a.back{padding:8px 12px;border:1px solid #8aa7bd;border-radius:4px;background:#eef6fc;color:#164a7b;font-size:14px;text-decoration:none;cursor:pointer}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin:16px 0}th,td{border:1px solid #68869c;padding:10px 7px}th{background:#164a7b;color:white;font-size:14px;text-align:center;cursor:pointer}td{text-align:center;font-size:19px;font-weight:700}td:first-child{text-align:left;font-size:15px}.total td{background:#e0edf9;color:#154a73;font-weight:800}.grand td{background:#164a7b;color:white}.pending{color:#b45309}.rejected{color:#b42332}.accepted{color:#087548}.note{font-size:12px;color:#6c4c23}th button{border:0;background:none;color:inherit;font:inherit;padding:0;width:100%;border-radius:0}thead{display:table-header-group}tr{break-inside:avoid}@media print{@page{size:A4 landscape;margin:10mm}body{padding:0;background:white}main{max-width:none;padding:0;border:0}nav{display:none}h1{font-size:19px}td{font-size:15px}th{font-size:12px}th,td{padding:7px 5px}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}

<h1>पूर्ण कार्यों का जियो टैग — Phase II: After</h1><p class="meta">स्रोत रिपोर्ट जनरेशन दिनांक: 21/10/2026 • समय: 06:29:11.54056</p><div class="wrap"><table><thead><tr><th><button data-sort="-1">जनपद ▲▼</button></th><th><button data-sort="0">कुल कार्य ▲▼</button></th><th><button data-sort="1">जियो टैग योग्य नहीं ▲▼</button></th><th><button data-sort="2">जियो टैग शेष ▲▼</button></th><th><button data-sort="3">मॉडरेशन शेष ▲▼</button></th><th><button data-sort="4">स्वीकृत ▲▼</button></th><th><button data-sort="5">अस्वीकृत ▲▼</button></th></tr></thead><tbody id="rows"></tbody></table></div><p class="note">स्रोत: उपयोगकर्ता द्वारा उपलब्ध कराई गई रिपोर्ट। मूल रिपोर्ट में सभी जनपद SATNA नाम के अंतर्गत हैं; यहाँ वर्तमान जिला विभाजन अनुसार दिखाए गए हैं।</p></main><script>
const data=[{"block":"AMARPATAN","name":"अमरपाटन","district":"मैहर","values":[3765,0,104,0,3660,1]},{"block":"MAIHAR","name":"मैहर","district":"मैहर","values":[8060,0,431,20,7601,8]},{"block":"MAJHGAWAN","name":"मझगवां","district":"सतना","values":[8671,40,1326,0,7304,1]},{"block":"NAGOD","name":"नागौद","district":"सतना","values":[6232,0,679,1,5543,9]},{"block":"RAMNAGAR","name":"रामनगर","district":"मैहर","values":[3158,0,23,0,3135,0]},{"block":"RAMPUR BAGHELAN","name":"रामपुर बघेलान","district":"सतना","values":[3460,7,547,12,2882,12]},{"block":"SATNA","name":"सोहावल","district":"सतना","values":[3996,0,823,0,3173,0]},{"block":"UNCHAHARA","name":"उचेहरा","district":"सतना","values":[4893,14,519,86,4254,20]}];let sort=-1,dir=1;
const total=rows=>rows.reduce((a,r)=>a.map((n,i)=>n+r.values[i]),[0,0,0,0,0,0]);
function row(name,values,cls=''){return '<tr class="'+cls+'"><td>'+name+'</td>'+values.map((v,i)=>'<td class="'+(['','','pending','pending','accepted','rejected'][i])+'">'+v.toLocaleString('en-IN')+'</td>').join('')+'</tr>'}
function render(){const selected=document.getElementById('district').value;let html='',all=[];for(const district of ['मैहर','सतना']){if(selected&&selected!==district)continue;const rows=data.filter(r=>r.district===district).sort((a,b)=>dir*(sort<0?a.name.localeCompare(b.name,'hi'):a.values[sort]-b.values[sort]));all.push(...rows);for(const r of rows)html+=row(r.name,r.values);html+=row('जिला '+district+' — योग',total(rows),'total')}html+=row('महायोग',total(all),'grand');document.getElementById('rows').innerHTML=html}
document.getElementById('district').addEventListener('change',render);document.getElementById('print').addEventListener('click',()=>window.print());document.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{const next=Number(b.dataset.sort);dir=sort===next?-dir:1;sort=next;render()}));render();
</script></body></html>
