<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>युक्तधारा — मध्यप्रदेश 52 जिले</title><style>body{font:16px Arial,sans-serif;background:#eef3fa;color:#17324d;margin:20px}main{background:white;padding:20px;border-radius:12px}h1{color:#493095}nav{display:flex;gap:16px;align-items:center}button,input{padding:9px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border:1px solid #a7b9ce;padding:9px;text-align:right}th{background:#283d77;color:white;cursor:pointer}td:first-child{text-align:left}td{font-weight:bold}tr.selected{background:#fff0b9}tfoot{background:#dce8f7}thead{display:table-header-group}.wrap{overflow:auto}@media print{@page{size:A4 landscape;margin:10mm}nav{display:none}body{margin:0;background:white}main{padding:0}th{background:#ddd;color:black}th,td{padding:6px;font-size:12px}}</style><main><nav><a href="index.html">← मुख्य डैशबोर्ड</a><input id="q" placeholder="जिला खोजें"><button onclick="print()">Print / PDF</button></nav><h1>युक्तधारा मॉनिटरिंग — मध्यप्रदेश के 52 जिले</h1><p id="meta"></p><div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody><tfoot id="foot"></tfoot></table></div><p>प्रतिशत मूल स्रोत के अनुपात पर: कार्य प्राप्त GP ÷ कुल GP; बने कार्य ÷ प्राप्त कार्य; प्रगतिरत ÷ प्रारंभ नहीं हुए कार्य। अंतिम अनुपात स्रोत में इसी आधार पर है।</p></main><script>
let data=[],col='gpPct',dir=-1;const labels=[['district','जिला'],['gp','कुल GP'],['gpReceived','कार्य प्राप्त GP'],['gpPct','GP %'],['worksReceived','प्राप्त कार्य'],['worksCreated','VB-G RAM G में बने'],['createdPct','बने कार्य %'],['yetToStart','प्रारंभ शेष'],['ongoing','प्रगतिरत'],['ongoingPct','प्रगतिरत %']];const ratio=(a,b)=>b?100*a/b:0;const enrich=r=>({...r,gpPct:ratio(r.gpReceived,r.gp),createdPct:ratio(r.worksCreated,r.worksReceived),ongoingPct:ratio(r.ongoing,r.yetToStart)});function row(r){const tr=document.createElement('tr');if(r.district==='SATNA')tr.className='selected';for(const [k] of labels){let td=document.createElement('td');td.textContent=k==='district'?r[k]:k.endsWith('Pct')?r[k].toFixed(2)+'%':r[k].toLocaleString('en-IN');tr.append(td)}return tr}function render(){let a=data.filter(r=>r.district.toLowerCase().includes(document.getElementById('q').value.toLowerCase())).sort((a,b)=>dir*(col==='district'?a[col].localeCompare(b[col]):a[col]-b[col]));document.getElementById('body').replaceChildren(...a.map(row));const t={district:'चयनित जिलों का योग'};for(const k of ['gp','gpReceived','worksReceived','worksCreated','yetToStart','ongoing'])t[k]=a.reduce((s,r)=>s+r[k],0);document.getElementById('foot').replaceChildren(row(enrich(t)))}for(const [k,label] of labels){const th=document.createElement('th');th.textContent=label+' ↕';th.onclick=()=>{dir=col===k?-dir:1;col=k;render()};document.getElementById('head').append(th)}document.getElementById('q').oninput=render;fetch('data/yuktdhara-state-latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('डेटा उपलब्ध नहीं');return r.json()}).then(d=>{data=d.rows.map(enrich);document.getElementById('meta').textContent='FY '+d.financialYear+' • '+(d.fetchedAt?'पोर्टल से प्राप्ति: '+d.fetchedAt:'Excel प्राप्ति: '+d.importedDate)+' • '+(d.officialDate?'पोर्टल तिथि: '+d.officialDate:'मूल Excel में स्रोत तिथि उपलब्ध नहीं');render()}).catch(e=>document.getElementById('meta').textContent=e.message);
</script></html>
