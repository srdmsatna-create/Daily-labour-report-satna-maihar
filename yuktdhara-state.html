</style><main><nav><a href="index.html">← मुख्य डैशबोर्ड</a><input id="q" placeholder="जिला खोजें"><button onclick="print()">Print / PDF</button></nav><h1>R-3.4 — युक्तधारा मॉनिटरिंग रिपोर्ट</h1><p class="subtitle">मध्यप्रदेश • 52 जिले • वित्तीय वर्ष 2026–27</p><p id="meta"></p><div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody><tfoot id="foot"></tfoot></table></div><p>प्रतिशत मूल स्रोत के अनुपात पर: कार्य प्राप्त GP ÷ कुल GP; बने कार्य ÷ प्राप्त कार्य; प्रगतिरत ÷ प्रारंभ नहीं हुए कार्य। अंतिम अनुपात स्रोत में इसी आधार पर है।</p></main><script>
let data=[],col='gpPct',dir=-1;const labels=[['serial','क्र.'],['district','जिला'],['gp','कुल GP'],['gpReceived','कार्य प्राप्त GP'],['gpPct','GP %'],['worksReceived','प्राप्त कार्य'],['worksCreated','VB-G RAM G में बने'],['createdPct','बने कार्य %'],['yetToStart','प्रारंभ शेष'],['ongoing','प्रगतिरत'],['ongoingPct','प्रगतिरत %']];const ratio=(a,b)=>b?100*a/b:0;const enrich=r=>({...r,gpPct:ratio(r.gpReceived,r.gp),createdPct:ratio(r.worksCreated,r.worksReceived),ongoingPct:ratio(r.ongoing,r.yetToStart)});function row(r,serial=''){const tr=document.createElement('tr');if(r.district==='SATNA')tr.className='selected';for(const [k] of labels){let td=document.createElement('td');td.textContent=k==='serial'?serial:k==='district'?r[k]:k.endsWith('Pct')?r[k].toFixed(2)+'%':r[k].toLocaleString('en-IN');tr.append(td)}return tr}function render(){let a=data.filter(r=>r.district.toLowerCase().includes(document.getElementById('q').value.toLowerCase())).sort((a,b)=>dir*(col==='district'?a[col].localeCompare(b[col]):a[col]-b[col]));document.getElementById('body').replaceChildren(...a.map((r,i)=>row(r,i+1)));const t={district:'चयनित जिलों का योग'};for(const k of ['gp','gpReceived','worksReceived','worksCreated','yetToStart','ongoing'])t[k]=a.reduce((s,r)=>s+r[k],0);document.getElementById('foot').replaceChildren(row(enrich(t)))}for(const [k,label] of labels){const th=document.createElement('th');th.textContent=label+' ↕';if(k==='serial'){th.textContent=label;document.getElementById('head').append(th);continue}th.tabIndex=0;th.title='क्रम बदलने के लिए क्लिक करें';th.onclick=()=>{dir=col===k?-dir:1;col=k;render();document.querySelectorAll('#head th').forEach((h,i)=>{h.textContent=labels[i][1]+(labels[i][0]===col?(dir===1?' ▲':' ▼'):' ↕')})};th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();th.click()}};document.getElementById('head').append(th)}document.getElementById('q').oninput=render;fetch('data/yuktdhara-state-latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('डेटा उपलब्ध नहीं');return r.json()}).then(d=>{data=d.rows.map(enrich);document.getElementById('meta').textContent='FY '+d.financialYear+' • '+(d.fetchedAt?'पोर्टल से प्राप्ति: '+d.fetchedAt:'Excel प्राप्ति: '+d.importedDate)+' • '+(d.officialDate?'पोर्टल तिथि: '+d.officialDate:'मूल Excel में स्रोत तिथि उपलब्ध नहीं');render()}).catch(e=>document.getElementById('meta').textContent=e.message);
