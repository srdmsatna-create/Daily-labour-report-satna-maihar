**स्रोत-संबंधी स्थिति:** `auto-data.js` का पुराना ongoing कुल **15,618** नवीनतम R6.12 से मेल नहीं खाता। इसलिए यहाँ R6.12 के **15,763 अलग ongoing कार्यों** को GP से मिलाकर जनपद तथा उपयंत्रीवार गणना की गई है। दोनों स्रोतों के समय अलग हैं; कार्य प्रतिशत उन्हीं बताए गए snapshots पर आधारित हैं। सक्रिय श्रमिक की सत्यापित संख्या उपलब्ध नहीं है। श्रेणी-विशेष पुराने PMAY/सामुदायिक आदि आँकड़े इन संदेशों में नहीं जोड़े गए हैं।

स्रोत: [मुख्य डेटा](https://srdmsatna.online/auto-data.js) · [fetch स्थिति](https://srdmsatna.online/auto-status.js) · [GP/श्रमिक डेटा](https://srdmsatna.online/shramik-gp-progress-data.js) · [R6.12 स्थिति](https://srdmsatna.online/data/mis-6.12-status.json) · [कार्य-सूची](https://srdmsatna.online/ongoing-details.json.gz) · [उपयंत्री आवंटन](https://srdmsatna.online/gp-sector-mapping-overrides.js)</textarea><div class="status" id="status-2" aria-live="polite"></div></section>
</main>
<script>
document.querySelectorAll("button.copy").forEach(button=>button.addEventListener("click",async()=>{
 const i=button.dataset.copy,field=document.querySelectorAll("textarea")[Number(i)],status=document.getElementById("status-"+i);
 const preview = field.parentElement.querySelector('.message-preview');
 if (preview && typeof ClipboardItem !== 'undefined' && navigator.clipboard?.write) {
  const copy = preview.cloneNode(true);
  for (const table of copy.querySelectorAll('table')) {
   table.style.borderCollapse = 'collapse';
   table.style.border = '2px solid #526b82';
   for (const cell of table.querySelectorAll('th, td')) {
    cell.style.border = '1px solid #71869a';
    cell.style.padding = '6px 9px';
    if (cell.tagName === 'TH') cell.style.backgroundColor = table.style.getPropertyValue('--section-color') || '#eef5fb';
   }
  }
  try {
   await navigator.clipboard.write([new ClipboardItem({
    'text/html': new Blob([copy.innerHTML], {type:'text/html'}),
    'text/plain': new Blob([field.value], {type:'text/plain'})
   })]);
   status.textContent = 'टेबल फ़ॉर्मेट में कॉपी हो गया।';
   return;
  } catch (error) {
   // Some browsers only support copying plain text.
  }
 }
 try {
  await navigator.clipboard.writeText(field.value);
  status.textContent = 'टेक्स्ट कॉपी हो गया।';
 } catch (error) {
  field.hidden = false;
  field.focus();
  field.select();
  const copied = document.execCommand('copy');
  field.hidden = copied;
  status.textContent = copied ? 'टेक्स्ट कॉपी हो गया।' : 'चुना हुआ संदेश कॉपी करें।';
 }
}));

async function refreshDailyMessages() {
 const notice = document.querySelector('.notice');
 const read = async (path, assignment = false) => {
  const response = await fetch(path, {cache: 'no-store'});
  if (!response.ok) throw new Error(path);
  if (!assignment) return response.json();
  const source = await response.text();
  return JSON.parse(source.slice(source.indexOf('=') + 1).trim().replace(/;$/, ''));
 };
 const [gp, works, mis] = await Promise.all([
  read('shramik-gp-progress-data.js', true),
  read('ongoing-details.js', true),
  read('data/mis-6.12-status.json')
 ]);
 const blocks = [
  ['MAJHGAWAN','मझगवां'], ['NAGOD','नागौद'], ['RAMPUR BAGHELAN','रामपुर बघेलान'],
  ['SATNA','सोहावल'], ['UNCHAHARA','उचेहरा'], ['AMARPATAN','अमरपाटन'],
  ['MAIHAR','मैहर'], ['RAMNAGAR','रामनगर']
 ];
 const key = value => String(value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
 const blockKey = value => ({SOHAWAL:'SATNA',RAMPORBAGHELAN:'RAMPURBAGHELAN'}[key(value)] || key(value));
 const gpKey = row => blockKey(row.janpad) + '|' + key(row.panchayat);
 const byGP = new Map(gp.rows.map(row => [gpKey(row), row]));
 if (!gp.gpProgressVerified || gp.rows.length !== 695 || byGP.size !== 695 || !gp.sourceLastUpdated || !mis.updatedAt) {
  throw new Error('Incomplete source data');
 }
 const ongoing = new Map();
 const seen = new Set();
 for (const work of works) {
  if (String(work.status).trim().toUpperCase() !== 'ONGOING' || !work.code || seen.has(work.code)) continue;
  const id = gpKey(work);
  if (!byGP.has(id)) throw new Error('Unmatched ongoing work');
  seen.add(work.code);
  ongoing.set(id, (ongoing.get(id) || 0) + 1);
 }
 if (seen.size !== mis.statusCounts?.Ongoing) throw new Error('Ongoing total differs from R6.12');
 const sum = rows => ({
  gps: rows.length,
  progress: rows.reduce((n, row) => n + Number(row.gpsProgress), 0),
  labour: rows.reduce((n, row) => n + Number(row.labour), 0),
  mr: rows.every(row => row.mrs != null) ? rows.reduce((n, row) => n + Number(row.mrs), 0) : null,
  mrWorks: rows.reduce((n, row) => n + Number(row.worksMR), 0),
  ongoing: rows.reduce((n, row) => n + (ongoing.get(gpKey(row)) || 0), 0),
  zero: rows.filter(row => Number(row.labour) === 0).length
 });
 const fmt = n => n == null ? 'अनुपलब्ध' : n.toLocaleString('en-IN');
 const pct = (a,b) => b ? (100*a/b).toFixed(1) + '%' : '—';
 const summaryTable = entries => [
  '| जनपद / जिला | कुल पंचायतें | कार्य प्रगतिरत पंचायतें | संलग्न श्रमिक | श्रमिक शून्य पंचायतें | जारी MR | MR वाले कार्य / प्रगतिरत कार्य |',
  '|---|---:|---:|---:|---:|---:|---:|',
  ...entries.map(([label, rows]) => {
   const s = sum(rows);
   return '| ' + [label, fmt(s.gps), fmt(s.progress) + ' (' + pct(s.progress,s.gps) + ')',
    fmt(s.labour), fmt(s.zero), fmt(s.mr), fmt(s.mrWorks) + ' / ' + fmt(s.ongoing) +
    ' (' + pct(s.mrWorks,s.ongoing) + ')'].join(' | ') + ' |';
  })
 ].join('\n');
 const districtRows = list => gp.rows.filter(row => list.some(([code]) => blockKey(code) === blockKey(row.janpad)));
 const satna = districtRows(blocks.slice(0,5)), maihar = districtRows(blocks.slice(5));
 if (satna.length !== 450 || maihar.length !== 245 || blocks.some(([code]) => !districtRows([[code]]).length)) throw new Error('Janpad coverage mismatch');
 const janpadEntries = list => list.map(([code,label]) => [label, districtRows([[code]])]);
 const districtMessage = (name, list, rows) => {
  const parts = ['🌿 **VB-G RAM G — ' + name + ' दैनिक सारांश**', summaryTable([...janpadEntries(list), [name + ' जिला योग', rows]])];
  for (const [code,label] of list) {
   const janpadRows = districtRows([[code]]);
   const engineers = new Map();
   for (const row of janpadRows) {
    const label = (row.engineer || 'आवंटन उपलब्ध नहीं') + ' / ' + (row.cluster || '—');
    if (!engineers.has(label)) engineers.set(label, []);
    engineers.get(label).push(row);
   }
   const lines = ['| उपयंत्री / क्लस्टर | जारी MR | Ongoing | MR वाले कार्य | कार्य % | संलग्न श्रमिक | शून्य GP |'];
   lines.push('|---|---:|---:|---:|---:|---:|---:|');
   for (const [label, group] of engineers) {
    const s = sum(group);
    lines.push('| ' + [label, fmt(s.mr), fmt(s.ongoing), fmt(s.mrWorks), pct(s.mrWorks,s.ongoing), fmt(s.labour), fmt(s.zero)].join(' | ') + ' |');
   }
   parts.push('**' + label + '**\n' + lines.join('\n'));
  }
  parts.push('सक्रिय श्रमिक और संलग्नता प्रतिशत: सत्यापित डेटा उपलब्ध नहीं।');
  return parts.join('\n\n');
 };
 const messages = [
  districtMessage('सतना', blocks.slice(0,5), satna),
  districtMessage('मैहर', blocks.slice(5), maihar),
  ['🌿 **सतना–मैहर संयुक्त दैनिक सारांश**',
   summaryTable([...janpadEntries(blocks.slice(0,5)), ['सतना जिला योग', satna],
    ...janpadEntries(blocks.slice(5)), ['मैहर जिला योग', maihar], ['संयुक्त कुल', gp.rows]])
  ].join('\n\n')
 ];
 document.querySelectorAll('textarea').forEach((field,i) => {field.value = messages[i];});
 notice.textContent = 'तीनों संदेश Daily Updater के नवीनतम सत्यापित स्रोतों से बने हैं।';
}
function renderMessageTables() {
 const janpadColors = new Map([
  ['मझगवां','#e7f3ff'], ['नागौद','#eaf6e3'], ['रामपुर बघेलान','#fff1d8'],
  ['सोहावल','#f1e7fa'], ['उचेहरा','#fde9e7'], ['अमरपाटन','#def5f0'],
  ['मैहर','#fff6cc'], ['रामनगर','#e8ecff']
 ]);
 for (const field of document.querySelectorAll('textarea')) {
  const preview = document.createElement('div');
  preview.className = 'message-preview';
  const lines = field.value.split('\n');
  let table, sectionColor;
  for (const line of lines) {
   const clean = line.trim().replace(/\*\*/g, '');
   if (clean.startsWith('|') && clean.endsWith('|')) {
    const cells = clean.slice(1,-1).split('|').map(cell => cell.trim());
    if (cells.every(cell => /^:?-{3,}:?$/.test(cell))) continue;
    const header = !table;
    if (header) {table = document.createElement('table'); preview.append(table);}
    const row = table.insertRow();
    const rowColor = janpadColors.get(cells[0]) || (/जिला योग|संयुक्त कुल/.test(cells[0]) ? '#e1edf7' : null);
    if (rowColor) row.style.backgroundColor = rowColor;
    if (header && sectionColor) table.style.setProperty('--section-color',sectionColor);
    for (const cell of cells) {
     const element = document.createElement(header ? 'th' : 'td');
     element.textContent = cell;
     row.append(element);
    }
   } else {
    table = null;
    if (!clean) continue;
    const paragraph = document.createElement('p');
    paragraph.textContent = clean;
    sectionColor = janpadColors.get(clean);
    if (sectionColor) {paragraph.className = 'janpad-heading'; paragraph.style.backgroundColor = sectionColor;}
    preview.append(paragraph);
   }
  }
  field.before(preview);
  field.hidden = true;
 }
}
refreshDailyMessages().catch(() => {
 const notice = document.querySelector('.notice');
 notice.textContent = 'नवीनतम स्रोतों का पूरा मिलान उपलब्ध नहीं है। नीचे सहेजे गए पुराने संदेश हैं।';
}).finally(renderMessageTables);
</script>
</body></html>
